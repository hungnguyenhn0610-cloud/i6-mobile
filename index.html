<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i6 Mobile - Hệ Thống Bán Lẻ Điện Thoại Chính Hãng</title>
    <!-- Font Awesome cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        /* 1. TOP BAR */
        .top-bar {
            background-color: #d70018;
            color: white;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-bar-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .top-bar-left, .top-bar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-bar-item {
            color: #fff;
            text-decoration: none;
        }

        /* 2. MAIN HEADER */
        .header {
            background-color: #d70018;
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 10px;
        }

        /* LOGO I6MOBILE */
        .logo-cellphones-style {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -1px;
        }

        .logo-cellphones-style .brand-text {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            font-size: 28px;
            font-weight: 900;
        }

        .logo-cellphones-style .brand-box {
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 4px;
            line-height: 1;
        }

        /* DROPDOWN CHỌN ĐỊA ĐIỂM */
        .location-dropdown {
            position: relative;
        }

        .location-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .location-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-top: 5px;
            display: none;
            z-index: 1001;
            min-width: 160px;
            overflow: hidden;
        }

        .location-item {
            padding: 10px 15px;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-item:hover {
            background-color: #fef2f2;
            color: #d70018;
        }

        /* SEARCH BOX & SUGGESTIONS */
        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px 9px 38px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 13px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-top: 5px;
            display: none;
            z-index: 1001;
            max-height: 300px;
            overflow-y: auto;
        }

        .suggestion-item {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            text-decoration: none;
            color: #333;
        }

        .suggestion-item:hover {
            background-color: #fef2f2;
        }

        .suggestion-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .header-action {
            color: white;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }

        .header-action:hover {
            background: rgba(255, 255, 255, 0.25);
        }
