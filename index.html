<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i6 Mobile - Hệ Thống Bán Lẻ Điện Thoại Chính Hãng</title>
    <!-- Font Awesome cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9; /* Phông nền màu xanh xám nhạt hiện đại, dịu mắt */
            color: #1e293b;
        }

        /* 1. TOP BAR */
        .top-bar {
            background-color: #1e293b; /* Xanh đậm lịch lãm cho thanh trên cùng */
            color: white;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-bar-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .top-bar-left, .top-bar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-bar-item {
            color: #fff;
            text-decoration: none;
        }

        /* 2. MAIN HEADER */
        .header {
            background-color: #0f172a; /* Xanh than chuyên nghiệp */
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 10px;
        }

        /* LOGO I6MOBILE */
        .logo-cellphones-style {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 8px;
        }

        .logo-cellphones-style .brand-logo {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        .logo-cellphones-style .brand-text {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
        }

        /* DROPDOWN CHỌN ĐỊA ĐIỂM */
        .location-dropdown {
            position: relative;
        }

        .location-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .location-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-top: 5px;
            display: none;
            z-index: 1001;
            min-width: 160px;
            overflow: hidden;
        }

        .location-item {
            padding: 10px 15px;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-item:hover {
            background-color: #e0f2fe;
            color: #0284c7;
        }

        /* SEARCH BOX & SUGGESTIONS */
        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px 9px 38px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 13px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-top: 5px;
            display: none;
            z-index: 1001;
            max-height: 300px;
            overflow-y: auto;
        }

        .suggestion-item {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            text-decoration: none;
            color: #333;
        }

        .suggestion-item:hover {
            background-color: #f1f5f9;
        }

        .suggestion-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .header-action {
            color: white;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }

        .header-action:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 3. CONTAINER & HERO */
        .container {
            max-width: 1200px;
            margin: 15px auto;
            padding: 0 10px;
        }

        .hero-section {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* SIDEBAR MENU */
        .sidebar {
            width: 220px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-title {
            padding: 12px 15px;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            color: #333;
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid #f8f8f8;
            transition: 0.2s;
        }

        .sidebar-menu li a:hover {
            background-color: #f1f5f9;
            color: #0284c7;
        }

        /* MAIN BANNER */
        .main-banner {
            flex: 1;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1e293b 100%);
            border-radius: 12px;
            padding: 20px 24px;
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .banner-top-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .fire-badge {
            color: #38bdf8;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timer-badge {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .banner-content-grid {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 15px;
            align-items: center;
        }

        .sub-title {
            display: inline-block;
            background: #d97706;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .banner-product-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .banner-product-title span {
            color: #38bdf8;
        }

        .banner-product-desc {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .price-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        .price-values {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .main-price {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
        }

        .old-price {
            font-size: 13px;
            color: #64748b;
            text-decoration: line-through;
        }

        .discount-badge {
            background: #0284c7;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .installment-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 15px;
        }

        .inst-title {
            color: #34d399;
            font-weight: 700;
            font-size: 12px;
        }

        .hero-phone-img {
            width: 100%;
            max-width: 200px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* FILTER TAG / CHIP */
        .filter-tags-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-tag-chip {
            display: inline-flex;
            align-items: center;
            background-color: #1e293b;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .chip-logo-img {
            height: 18px;
            width: auto;
            object-fit: contain;
        }

        .tag-close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 15px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            opacity: 0.8;
        }

        .tag-close-btn:hover {
            opacity: 1;
        }

        /* 4. PRODUCT GRID */
        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 6px;
        }

        .product-price-box {
            margin-bottom: 10px;
        }

        .card-price {
            font-size: 16px;
            font-weight: 800;
            color: #0284c7;
        }

        .card-old-price {
            font-size: 12px;
            color: #888;
            text-decoration: line-through;
            margin-left: 6px;
        }

        .card-promo {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            font-size: 11px;
            padding: 6px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-card-buy {
            flex: 1;
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-card-buy:hover {
            background: #0369a1;
        }

        .btn-card-installment {
            flex: 1;
            background: #fff;
            color: #0284c7;
            border: 1px solid #0284c7;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        /* 5. FOOTER */
        .footer {
            background: #ffffff;
            margin-top: 40px;
            border-top: 1px solid #e2e8f0;
            padding: 30px 0 20px 0;
            color: #4b5563;
            font-size: 13px;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .footer-col h4 {
            font-size: 15px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 6px;
            display: inline-block;
        }

        .footer-col p {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .footer-col p i {
            color: #0284c7;
            width: 20px;
        }

        .footer-bottom {
            text-align: center;
            border-top: 1px solid #f1f5f9;
            margin-top: 25px;
            padding-top: 15px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* MODAL ĐẶT HÀNG */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background:
