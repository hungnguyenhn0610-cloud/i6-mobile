<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị Admin - i6 Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
        }

        /* MÀN HÌNH ĐĂNG NHẬP */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* GIAO DIỆN QUẢN TRỊ CHÍNH */
        #adminDashboard {
            display: none;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .admin-header-bar {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #d70018;
            color: white;
            border-color: #d70018;
        }

        .admin-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }

        .btn-main {
            background: #d70018;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            font-size: 13px;
            text-align: left;
        }

        th {
            background-color: #f9fafb;
        }

        .back-link {
            color: #d70018;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH BẢO MẬT ĐĂNG NHẬP -->
    <div id="loginScreen">
        <div class="login-box">
            <h2 style="margin-bottom: 20px; color: #d70018; text-align: center;"><i class="fas fa-lock"></i> Đăng Nhập Admin</h2>
            <div class="form-group">
                <label>Mật khẩu quản trị (Mặc định: admin123):</label>
                <input type="password" id="adminPassInput" placeholder="Nhập mật khẩu...">
            </div>
            <button class="btn-main" style="width: 100%;" onclick="loginAdmin()">ĐĂNG NHẬP HỆ THỐNG</button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại trang chủ i6 Mobile</a>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN QUẢN TRỊ CHÍNH -->
    <div id="adminDashboard">
        <div class="admin-header-bar">
            <h2><i class="fas fa-cogs"></i> Quản Trị i6 Mobile</h2>
            <div>
                <a href="index.html" class="back-link" style="margin-right: 20px;" target="_blank"><i class="fas fa-external-link-alt"></i> Xem Website</a>
                <button class="btn-main" onclick="logoutAdmin()" style="background: #4b5563;">Đăng xuất</button>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('addProductTab', this)"><i class="fas fa-plus-circle"></i> Thêm Sản Phẩm Mới</button>
            <button class="tab-btn" onclick="switchTab('ordersTab', this)"><i class="fas fa-shopping-bag"></i> Đơn Hàng Mới (<span id="orderCountBadge">0</span>)</button>
        </div>

        <!-- TAB 1: THÊM SẢN PHẨM -->
        <div id="addProductTab" class="admin-card">
            <h3 style="margin-bottom: 15px; color: #1f2937;">Thêm điện thoại mới lên gian hàng</h3>
            <form id="addProductForm" onsubmit="addNewProduct(event)">
                <div class="form-group">
                    <label>Tên điện thoại:</label>
                    <input type="text" id="prodName" required placeholder="VD: iPhone 18 Pro Max 512GB">
                </div>
                <div class="form-group">
                    <label>Giá bán ưu đãi (VNĐ):</label>
                    <input type="number" id="prodPrice" required placeholder="VD: 31990000">
                </div>
                <div class="form-group">
                    <label>Giá cũ niêm yết (VNĐ):</label>
                    <input type="number" id="prodOldPrice" required placeholder="VD: 35990000">
                </div>
                <div class="form-group">
                    <label>Link ảnh sản phẩm (URL trực tuyến):</label>
                    <input type="url" id="prodImg" required placeholder="Dán link ảnh vào đây...">
                </div>
                <div class="form-group">
                    <label>Chương trình khuyến mãi / Tặng kèm:</label>
                    <input type="text" id="prodPromo" placeholder="VD: Tặng củ sạc 45W • Trả góp 0%">
                </div>
                <button type="submit" class="btn-main">ĐĂNG SẢN PHẨM LÊN WEBSITE</button>
            </form>
        </div>

        <!-- TAB 2: XEM ĐƠN HÀNG ĐẨY VỀ -->
        <div id="ordersTab" class="admin-card" style="display: none;">
            <h3 style="margin-bottom: 15px; color: #1f2937;">Danh sách khách hàng đặt mua / trả góp</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Khách hàng</th>
                            <th>Số điện thoại</th>
                            <th>Sản phẩm đặt</th>
                            <th>Hình thức thanh toán</th>
                            <th>Thời gian</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <!-- Đơn hàng tự động đồng bộ vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT QUẢN TRỊ ADMIN -->
    <script>
        // Link Web App Google Apps Script kết nối Google Sheets
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6vPa9jUV_Cfiw7U9w5R8Vyx95MTr-mCuj9ZTdCqvhC9Q3HQ-yxM6m7GT3SbHvTd4/exec";

        function loginAdmin() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === 'admin123') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadOrders();
            } else {
                alert('Mật khẩu quản trị không đúng! (Mật khẩu mặc định: admin123)');
            }
        }

        function logoutAdmin() {
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('adminPassInput').value = '';
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.admin-card').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
            if(tabId === 'ordersTab') loadOrders();
        }

        // HÀM THÊM SẢN PHẨM GỬI LÊN GOOGLE SHEETS
        function addNewProduct(e) {
            e.preventDefault();
            
            const newP = {
                name: document.getElementById('prodName').value.trim(),
                price: Number(document.getElementById('prodPrice').value),
                oldPrice: Number(document.getElementById('prodOldPrice').value),
                img: document.getElementById('prodImg').value.trim(),
                promo: document.getElementById('prodPromo').value.trim() || "Chính hãng • Bảo hành 12 tháng"
            };

            alert('Đang gửi sản phẩm lên hệ thống Google Sheets...');

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newP)
            })
            .then(() => {
                alert('Thêm sản phẩm thành công! Sản phẩm đã được lưu vào Google Sheets và xuất hiện trên trang chủ.');
                document.getElementById('addProductForm').reset();
            })
            .catch(err => {
                alert('Có lỗi xảy ra khi lưu sản phẩm!');
                console.error(err);
            });
        }

        function loadOrders() {
            let orders = JSON.parse(localStorage.getItem('i6_orders')) || [];
            const tbody = document.getElementById('orderTableBody');
            document.getElementById('orderCountBadge').innerText = orders.length;
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Chưa có đơn hàng nào được đặt từ khách hàng.</td></tr>`;
                return;
            }

            orders.forEach(o => {
                const formattedPrice = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(o.price).replace('₫', 'đ');
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${o.id}</strong></td>
                        <td>${o.name}<br><small style="color:#666;">${o.address}</small></td>
                        <td>${o.phone}</td>
                        <td>${o.product}<br><strong style="color:#d70018;">${formattedPrice}</strong></td>
                        <td><span style="color:green; font-weight:600;">${o.payment}</span></td>
                        <td>${o.date}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
